name: Build Yuzer Mikrofon APK
on:
  push:
    branches: [yuzer-mikrofon-apk]
    paths:
      - "YuzerMikrofon/**"
      - ".github/workflows/build-yuzer-mikrofon.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p YuzerMikrofon assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YuzerMikrofon-debug-apk
          path: YuzerMikrofon/app/build/outputs/apk/debug/app-debug.apk
